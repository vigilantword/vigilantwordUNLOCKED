name: Publish app

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the app
        run: |
          set -e
          zip=vigilantword-app-UNLOCKED.zip
          [ -f "$zip" ] || zip=$(ls *.zip | head -n 1)
          mkdir site
          unzip -q "$zip" -d site
          root=$(dirname "$(find site -name index.html -not -path '*/assets/*' | head -n 1)")
          test -f "$root/index.html"
          if [ "$root" != "site" ]; then mv "$root" app_out; rm -rf site; mv app_out site; fi
          ls site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
