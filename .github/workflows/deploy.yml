name: Publish app

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Unpack the app
        run: |
          set -e
          zip=vigilantword-app-UNLOCKED.zip
          [ -f "$zip" ] || zip=$(ls *.zip | head -n 1)
          mkdir site
          unzip -q "$zip" -d site
          root=$(dirname "$(find site -name index.html -not -path '*/assets/*' | head -n 1)")
          test -f "$root/index.html"
          if [ "$root" != "site" ]; then mv "$root" app_out; rm -rf site; mv app_out site; fi
          ls site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: try1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait and retry
        if: steps.try1.outcome == 'failure'
        run: sleep 15
      - name: Deploy to GitHub Pages (retry 1)
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait and retry again
        if: steps.try2.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (retry 2)
        id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Stop if every attempt failed
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure' && steps.try3.outcome == 'failure'
        run: exit 1
